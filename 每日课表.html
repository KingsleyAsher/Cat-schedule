(function(root) {

    const [y,m,d] = value.split('-').map(Number);

  }
  function dateKey(date) { return date.toISOString().slice(0,10); }
  function addDays(key,n) { return dateKey(new Date(parseDate(key).getTime()+n*DAY)); }
  function todayKey(now = new Date()) {
    const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
    const get = type => parts.find(p=>p.type===type).value;
    return `${get('year')}-${get('month')}-${get('day')}`;
  }
  function greeting(now=new Date()) {
    const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',hourCycle:'h23'}).format(now));

  }
  const anchor = '2026-08-30';
  const semesterEnd = '2027-01-15';

    const offset=S.parseDate(first).getUTCDay(),start=S.addDays(first,-offset),count=Math.ceil((offset+days)/7)*7;
    let total=0,busy=0;
    $('overview-grid').innerHTML=Array.from({length:count},(_,i)=>{
      const key=S.addDays(start,i),d=S.parseDate(key),outside=d.getUTCMonth()!==m;
      if(outside)return `<div class="overview-day outside" aria-hidden="true"><span class="overview-date">${d.getUTCDate()}</span></div>`;
      const list=S.coursesOn(key),events=S.eventsOn(key),week=S.teachingWeek(key);
      total+=list.length;if(list.length)busy++;
      const empty=events.some(e=>e.holiday)?'假期':week?'无课程':key<S.anchor?'未开学':'学期结束';
      return `<button class="overview-day ${key===today()?'is-today':''}" data-date="${key}" aria-label="${longDate(key)}，${list.length?list.map(c=>c.name+' '+c.start+'至'+c.end).join('，'):empty}"><div class="overview-date-row"><span class="overview-date">${d.getUTCDate()}</span>${key===today()?'<span class="overview-today-label">今天</span>':''}</div>${events.length?`<span class="overview-event">${events.map(e=>e.name).join(' · ')}</span>`:''}<div class="overview-courses">${list.length?list.map(c=>`<span class="overview-course"><span class="overview-time">${c.start}–${c.end}</span><span>${c.name}</span></span>`).join(''):`<span class="overview-empty">${empty}</span>`}</div></button>`;
    }).join('');
    $('overview-summary').textContent=`本月 ${busy} 天有课 · 共 ${total} 段课程`;
  }
  function shortDate(key){const d=S.parseDate(key);return `${d.getUTCMonth()+1}月${d.getUTCDate()}日`;}
  function longDate(key){const d=S.parseDate(key);return `${d.getUTCFullYear()}年${shortDate(key)}`;}
  function timeState(c,key){
    if(key!==today())return '';
    const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    const hm=parts.find(p=>p.type==='hour').value+':'+parts.find(p=>p.type==='minute').value;
    return hm<c.start?'upcoming':hm<c.end?'current':'finished';
  }
  function renderWeek(){
    const start=S.addDays(selected,-S.parseDate(selected).getUTCDay());
    $('week-days').innerHTML=weekdayNames.map((name,i)=>{
      const key=S.addDays(start,i), n=S.parseDate(key).getUTCDate();
      return `<button class="day-choice ${key===selected?'selected':''} ${key===today()?'is-today':''}" data-date="${key}" aria-label="${longDate(key)}，星期${name}" aria-pressed="${key===selected}"><span class="weekday">${name}</span><span class="day-number">${n}</span></button>`;
    }).join('');
  }
  function meta(name,text){return `<span class="meta-item">${icon(name)}<span>${text}</span></span>`;}
  function courseHTML(c){
    const state=timeState(c,selected);
    const status=state==='current'?'正在上课':state==='finished'?'已结束':'';
    let timing=c.first<=8?Array.from({length:c.last-c.first+1},(_,i)=>{const n=c.first+i;return `第 ${n} 节：${S.slots[n].join('–')}`;}).join('　／　'):`第 ${c.first}–${c.last} 节：${c.start}–${c.end}`;
    return `<article class="course-row"><div class="time-column"><span>${c.start}</span><span class="time-dash">│</span><span>${c.end}</span></div><details class="course-card ${state}" data-course-id="${c.id}"><summary aria-label="${c.name}，${c.start}至${c.end}，${c.room}，点击查看详情">${status?`<span class="course-status">${status}</span>`:''}<h2>${c.name}</h2><div class="course-meta">${meta('document',`第 ${c.first}–${c.last} 节`)}${meta('pin',c.room)}${meta('user',c.teacher)}${meta('calendar',`第 ${c.from}–${c.to} 周`)}</div></summary><div class="course-details"><div class="course-details-inner"><p>${timing}</p><p>适用日期：${shortDate(S.addDays(S.anchor,(c.from-1)*7+c.weekday))}—${shortDate(S.addDays(S.anchor,(c.to-1)*7+c.weekday))}</p>${c.name==='体育与健康'?'<p>原课表未注明任课教师及地点，请以学校通知为准。</p>':''}</div></div></details></article>`;
  }
  function renderGreeting(){
    $('daily-greeting').textContent=`${S.greeting()}，彭茜雅。`;
  }
  function renderDay(animate=true,direction=1){
    renderGreeting();
    const date=S.parseDate(selected),week=S.teachingWeek(selected),courses=S.coursesOn(selected),events=S.eventsOn(selected);
    $('date-title').textContent=shortDate(selected);
    $('date-subtitle').textContent=`${date.getUTCFullYear()}年 · 星期${weekdayNames[date.getUTCDay()]}`;
    $('week-label').textContent=week?`第 ${week} 周`:selected<S.anchor?'学期未开始':'学期已结束';
    renderWeek();
    const periods=[['morning','上午'],['afternoon','下午'],['evening','晚上']];
    const holiday=events.find(e=>e.holiday);
    let eventText=holiday?`${holiday.name} · ${shortDate(holiday.start)}—${shortDate(holiday.end)}`:events.map(e=>e.name).join(' · ');
    let message=courses.length===1?'今天只有这一门课，课后时间自由安排。':courses.length>1?`今天有 ${courses.length} 段课程，按自己的节奏，好好上课。`:holiday?'假期里，好好休息。':week?'今天没有安排课程，留一点时间给自己。':selected<S.anchor?'新学期还未开始。':'本学期课程已结束。';
    if(selected!==today())message=message.replaceAll('今天','这天');
    $('day-content').innerHTML=`${eventText?`<div class="event-message">${eventText}</div>`:''}<div class="timeline">${periods.map(([id,label])=>{
      const list=courses.filter(c=>c.period===id);
      return list.length?`<section class="period-section"><h2 class="period-heading">${label}</h2>${list.map(courseHTML).join('')}</section>`:`<section class="period-section empty"><div class="empty-label">${label}<span> · 无课程</span></div></section>`;
    }).join('')}</div><p class="day-message">${message}</p>`;
    if(animate){$('day-content').style.setProperty('--slide',`${direction*12}px`);$('day-content').classList.remove('content-enter');void $('day-content').offsetWidth;$('day-content').classList.add('content-enter');}
    document.title=`${shortDate(selected)} · 日课`;
  }
  function renderMonth(){
    const y=month.getUTCFullYear(),m=month.getUTCMonth();
    $('month-title').textContent=`${y}年${m+1}月`;
    const first=S.dateKey(new Date(Date.UTC(y,m,1)));
    const start=S.addDays(first,-S.parseDate(first).getUTCDay());
    const count=Math.ceil((S.parseDate(first).getUTCDay()+new Date(Date.UTC(y,m+1,0)).getUTCDate())/7)*7;
    $('month-grid').innerHTML=Array.from({length:count},(_,i)=>{
      const key=S.addDays(start,i),d=S.parseDate(key),outside=d.getUTCMonth()!==m;
      return `<button class="month-day ${outside?'outside':''} ${key===selected?'selected':''} ${key===today()?'today':''}" data-date="${key}" aria-label="${longDate(key)}" aria-pressed="${key===selected}">${d.getUTCDate()}</button>`;
    }).join('');
  }
  function renderTerm(){
    $('term-events').innerHTML=S.events.map(e=>`<article class="term-event ${today()>=e.start&&today()<=e.end?'is-current':''}"><time datetime="${e.start}">${shortDate(e.start)}${e.end!==e.start?`—${shortDate(e.end)}`:''}</time><div><h2>${e.name}</h2>${e.name==='学院运动会'?'<p>共 2 天，课程调整以学校通知为准。</p>':''}${e.name==='新生报到'?'<p>教学周按校历计算，不从报到日重新计数。</p>':''}</div></article>`).join('');
  }
  function setView(next){
    view=next;
    $('daily-view').hidden=view!=='daily';$('term-view').hidden=view!=='term';$('overview-view').hidden=view!=='overview';
    document.querySelector('.app-shell').classList.toggle('overview-open',view==='overview');
    document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    if(view==='term'){renderTerm();document.title='学期校历 · 日课';}else if(view==='overview'){renderOverview();document.title='月历课表总览 · 日课';}else renderDay(false);
  }
  function selectDate(key){const direction=key>=selected?1:-1;selected=key;month=S.parseDate(key);if(view!=='daily')setView('daily');renderDay(true,direction);renderMonth();}
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  $('week-days').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(b)selectDate(b.dataset.date);});
  $('month-grid').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(b)selectDate(b.dataset.date);});
  $('overview-grid').addEventListener('click',e=>{const b=e.target.closest('button[data-date]');if(b){selectDate(b.dataset.date);$('main').scrollIntoView({behavior:'smooth',block:'start'});}});
  $('overview-previous').addEventListener('click',()=>{overviewMonth=new Date(Date.UTC(overviewMonth.getUTCFullYear(),overviewMonth.getUTCMonth()-1,1));renderOverview();});
  $('overview-next').addEventListener('click',()=>{overviewMonth=new Date(Date.UTC(overviewMonth.getUTCFullYear(),overviewMonth.getUTCMonth()+1,1));renderOverview();});
  $('overview-today').addEventListener('click',()=>{overviewMonth=S.parseDate(today());renderOverview();});
  $('previous-week').addEventListener('click',()=>selectDate(S.addDays(selected,-S.parseDate(selected).getUTCDay()-1)));
  $('next-week').addEventListener('click',()=>selectDate(S.addDays(selected,7-S.parseDate(selected).getUTCDay())));
  $('today-button').addEventListener('click',()=>selectDate(today()));
  $('previous-month').addEventListener('click',()=>{month=new Date(Date.UTC(month.getUTCFullYear(),month.getUTCMonth()-1,1));renderMonth();});
  $('next-month').addEventListener('click',()=>{month=new Date(Date.UTC(month.getUTCFullYear(),month.getUTCMonth()+1,1));renderMonth();});
  $('show-calendar-source').addEventListener('click',()=>$('source-dialog').showModal());
  $('close-dialog').addEventListener('click',()=>$('source-dialog').close());
  $('source-dialog').addEventListener('click',e=>{if(e.target===$('source-dialog')){$('source-dialog').close();}});
  let touchStart=null;
  $('daily-view').addEventListener('touchstart',e=>{if(e.target.closest('button,summary,details'))return;touchStart={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};},{passive:true});
  $('daily-view').addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.6)selectDate(S.addDays(selected,dx<0?1:-1));},{passive:true});
  document.addEventListener('keydown',e=>{if(view!=='daily'||e.target.closest('button,summary,dialog,input,#welcome-screen'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();selectDate(S.addDays(selected,e.key==='ArrowRight'?1:-1));}});
  let lastToday=today();
  setInterval(()=>{
    const now=today();
    renderGreeting();
    if(now!==lastToday){if(selected===lastToday)selectDate(now);else{renderWeek();renderMonth();}lastToday=now;}
    if(view==='daily'&&selected===now){
      document.querySelectorAll('[data-course-id]').forEach(card=>{
        const c=S.courses.find(item=>item.id===Number(card.dataset.courseId)),state=timeState(c,selected);
        card.classList.remove('upcoming','current','finished');card.classList.add(state);
        const label=state==='current'?'正在上课':state==='finished'?'已结束':'';
        let status=card.querySelector('.course-status');
        if(label){if(!status){status=document.createElement('span');status.className='course-status';card.querySelector('summary').prepend(status);}status.textContent=label;}else if(status)status.remove();
      });
    }
  },60000);
  renderDay(false);renderMonth();renderTerm();
  const welcomeKey='rike.welcome.peng.v2';
  const welcomeScreen=$('welcome-screen');
  function hasSeenWelcome(){
    try{return localStorage.getItem(welcomeKey)==='yes'||sessionStorage.getItem(welcomeKey)==='yes';}catch{return false;}
  }
  function rememberWelcome(){
    try{localStorage.setItem(welcomeKey,'yes');}catch{try{sessionStorage.setItem(welcomeKey,'yes');}catch{/* Storage may be disabled by the browser. */}}
  }
  let welcomeTimer,exitTimer,leaving=false;
  function finishWelcome(){
    welcomeScreen.hidden=true;
    document.querySelector('.app-shell').inert=false;
    document.querySelector('.mobile-navigation').inert=false;
    document.body.classList.remove('welcome-playing');
    rememberWelcome();
    $('today-button').focus({preventScroll:true});
  }
  function enterTimetable(){
    if(leaving||welcomeScreen.hidden)return;
    leaving=true;clearTimeout(welcomeTimer);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){finishWelcome();return;}
    welcomeScreen.classList.add('leaving');
    exitTimer=setTimeout(finishWelcome,850);
  }
  welcomeScreen.addEventListener('click',enterTimetable);
  welcomeScreen.addEventListener('keydown',e=>{if(['Enter',' ','Escape'].includes(e.key)){e.preventDefault();enterTimetable();}});
  function showWelcome(duration=4600){
    clearTimeout(welcomeTimer);clearTimeout(exitTimer);leaving=false;
    welcomeScreen.classList.remove('leaving');
    welcomeScreen.hidden=false;
    document.body.classList.add('welcome-playing');
    document.querySelector('.app-shell').inert=true;
    document.querySelector('.mobile-navigation').inert=true;
    welcomeScreen.focus({preventScroll:true});
    welcomeTimer=setTimeout(enterTimetable,duration);
  }
  $('replay-welcome').addEventListener('click',()=>{setView('daily');showWelcome(15000);});
  if(!hasSeenWelcome())showWelcome();
})();

</script>
</body>
</html>
